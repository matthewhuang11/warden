name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify lockfile stability
        run: git diff --exit-code -- package-lock.json

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run tests
        run: npm test

      - name: Run HTTP resilience integration tests
        run: npx vitest run tests/serverResilience.test.ts

      - name: Run 50-seed robustness batch
        run: WARDEN_FUZZ_SEED_COUNT=50 npm run fuzz:batch

      - name: Typecheck and build
        run: npm run build

      - name: Verify packed installation
        run: npm run verify:package

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify lockfile stability
        run: git diff --exit-code -- package-lock.json

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Test aggregate-only data boundary
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Build production dashboard
        run: npm run build
